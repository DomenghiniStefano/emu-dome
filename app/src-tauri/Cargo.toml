[package]
name = "emudome"
description = "EmuDome: Game Boy, Game Boy Color, Game Boy Advance, Nintendo DS and Nintendo 3DS in one app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "emudome_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Bench mode (`EMUDOME_BENCH`, `bench.rs`): measures a session, writes a report and exits. Off by
# default and in every package; `cargo build -p emudome --features bench` for a bench run.
bench = ["emudome-platform/dev-core-paths"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
emudome-core.workspace = true
# TypeScript types of the DTOs (src/contract.rs → app/src/generated/app/). MIT. Same features as
# in emudome-core.
ts-rs = { version = "12.0", features = ["no-serde-warnings"] }
emudome-platform.workspace = true
# tauri, wgpu and librashader are pinned to exact versions and upgrade only together, as one task
# that ends with a native-video smoke test (game drawn under the menu, a screen effect on):
# librashader's wgpu must be our wgpu, and the native path leans on Tauri's `unstable` child webview.
# The same tauri pin is in crates/emudome-platform/Cargo.toml.
# "unstable" enables several webviews in the same window: needed to have
# the game's native surface underneath and the transparent web interface on top.
tauri = { version = "=2.12.5", features = ["unstable"] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
# The open game's shared state for the real-time threads (audio callback, controllers): read
# without a lock (`CurrentShared`). MIT OR Apache-2.0.
arc-swap = "1"
# Stable content names of the user's background images (`settings.rs`).
sha2 = "0.10"
wgpu = "=30.0.2"
# The raw Vulkan types of wgpu's own backend (`gpu_interop.rs`, the one module under wgpu): the
# same ash wgpu-hal 30 uses, one ash in the tree; it moves with wgpu. MIT OR Apache-2.0.
ash = "=0.38.0"
# Screen effects (`fx.*`): RetroArch `.slangp` presets on the native path. Its wgpu must stay
# the same version as ours (docs/feasibility.md, 2026-11-17). MPL-2.0 OR GPL-3.0.
librashader = { version = "=0.12.1", default-features = false, features = [
    "runtime-wgpu",
    "presets",
] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.18"
# Library folder watching (`library.watch`, desktop only at run time: `emudome_platform::PHONE`).
notify = "8"

# SDL3 is built for the desktop only (Android has no CMake toolchain set up for it and
# needs SDL's Java side for controllers): Android controllers come later.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Controllers through SDL3, joystick/gamepad and HIDAPI only (Steam Controller, PS, Switch).
# Built from source and linked statically: no SDL3.dll to ship.
# Needs CMake (CMAKE variable or cmake on PATH) and the system C compiler.
sdl3-sys = { version = "0.7", default-features = false, features = [
    "build-from-source-static",
    "no-default-subsystems",
    "sdl-joystick",
    "sdl-hidapi",
    "sdl-unix-console-build",
] }
