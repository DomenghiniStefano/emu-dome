{
  "about": "The libretro cores EmuDome fetches and ships, pinned. Read by scripts/cores.mjs (fetch, build, verify, generate, check) and by the Android Gradle build. Change it on purpose only: then run `node scripts/cores.mjs generate` and update THIRD_PARTY.md. Platforms: windows-x86_64, linux-x86_64 (libraries in cores/), android-arm64-v8a (cores/android/arm64-v8a/). A platform entry is either downloaded (url, sha256 of the archive and of every file taken from it) or built by EmuDome from source (built: the toolchain its sha256 came from, and release: the download folder of the EmuDome GitHub release `cores-<core>-<first 7 characters of the commit>` the built files were published to; the fetch downloads each file from release + its file name, sha256-checked, and builds only when that fails or with --build; the core's source.archive with its sha256 and its build block say what is built and how, scripts/core-build.mjs does it). url_stable false: the URL serves whatever the upstream built last, so the pinned bytes stop being downloadable when it rebuilds (packaging refuses such an entry unless EMUDOME_ALLOW_UNSTABLE_CORES=1).",
