      "build": {
        "about": "Built by EmuDome from source.archive for Android only (owner, 2026-11-22: upstream's Android release is linked with 4 KB pages, refused by Google Play and run in compatibility mode on 16 KB-page devices; docs/release.md, «Android: 16 KB pages»); Windows and Linux still take upstream's release files. scripts/core-build.mjs, behind the scripts below. cmake: upstream's Android arguments (.github/workflows/main.yaml at the tag: -DENABLE_OGLRENDERER=OFF; the ABI, the toolchain and -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON come from core-build.mjs's Android toolchain, which builds for API 26, the app's minSdk, where upstream says 24), and MELONDS_VERSION_SUFFIX empty so that the environment cannot change the version melonDS reports, and the module linked with --strip-all: the release build uses ThinLTO, whose promoted local symbols are named after a hash of each module, which holds its source path, so the symbol table, and with it the build ID lld computes over the whole file, changed with the build folder; with no symbol table written the build ID, and the file, are the same from any folder (measured: two builds from different folders differed only in the 20 bytes of the build ID before this option). output: the library's name as the core's CMake writes it on Android (suffix _android.so). Release build: the core reports the version of CHANGELOG.md (1.4.0), no git needed. dependencies: what cmake/FetchDependencies.cmake git-clones at configure time, each pinned to the commit its ref named when v1.4.0 was released (melonDS: the head of branch jtg/fix-uninitialized-opengl, unchanged since 2026-09-15; the others: the short hash or tag upstream names, resolved) and to the GitHub archive of that commit; the build extracts them where FetchContent would and configures with FETCHCONTENT_FULLY_DISCONNECTED, so nothing is fetched (tracy is fetched only with TRACY_ENABLE, off). notices: melondsds-LICENSE.txt, which the core's CMake writes from its template and the licence files of the dependencies (cmake/GenerateAttributions.cmake): every bundled licence, the same text as upstream's release asset.",
        "scripts": ["scripts/build-melondsds.ps1", "scripts/build-melondsds.sh"],
        "cmake": ["-DENABLE_OGLRENDERER=OFF", "-DMELONDS_VERSION_SUFFIX=", "-DCMAKE_MODULE_LINKER_FLAGS=-Wl,--strip-all"],
