[workspace]
resolver = "2"
members = [
    "crates/libretro-sys",
    "crates/emudome-core",
    "crates/emudome-platform",
    "crates/emudome-sync",
    "app/src-tauri",
]
# The hardware-rendering spike (Trello #16) is its own workspace, with its own Cargo.lock and
# target/: kept as a reference, never built by the checks (crates/hw-render-spike/Cargo.toml).
exclude = ["crates/hw-render-spike"]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/DomenghiniStefano/emu-dome"

[workspace.dependencies]
libretro-sys = { path = "crates/libretro-sys" }
emudome-core = { path = "crates/emudome-core" }
emudome-platform = { path = "crates/emudome-platform" }
emudome-sync = { path = "crates/emudome-sync" }

[profile.dev]
# File and line in backtraces and panics, without the full debug info: a smaller target/ and
# faster linking. Set `debug = true` locally for a session in a debugger.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies (wgpu, cpal...) built optimised in debug too,
# so the prototype runs at full speed during development. No debug info for them: nobody
# steps into wgpu, and it is most of what the linker reads.
opt-level = 2
debug = false

# Lints for every crate (each crate's Cargo.toml has `[lints] workspace = true`).
# `cargo clippy --workspace --all-targets -- -D warnings` turns them into errors; clippy.toml
# allows unwrap() in tests.
[workspace.lints.clippy]
wildcard_imports = "warn"
wildcard_enum_match_arm = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
