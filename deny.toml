# cargo-deny configuration: the Rust half of the licence check in scripts/check
# (`cargo deny check licenses`). Only the `licenses` section is used.
#
# EmuDome is GPL-3.0-or-later, so every crate in the dependency graph (every target: Windows,
# Linux, Android, and the macOS/iOS crates Cargo.lock still resolves) must be usable under it.
# The allow-list holds only licences that are compatible with GPL-3.0-or-later AND that the
# graph actually needs. Anything else fails the check. Before adding a licence here, check that
# the FSF lists it as GPL-3.0-compatible (https://www.gnu.org/licenses/license-list.html) and
# add the crate to THIRD_PARTY.md.
#
# Proved failing: with "MPL-2.0" commented out, `cargo deny check licenses` (cargo-deny 0.21.0)
# rejected cssparser, selectors, dtoa-short and option-ext and exited non-zero (2026-11-18).
#
# Blind spots: cargo-deny trusts the `license` field each crate declares (and the licence
# files it scans when the field is missing); it does not read the crate's sources. Native
# libraries a build script compiles (SDL3 through sdl3-src) are covered only by the crate's
# declared licence. The libretro cores are not crates: they are listed in THIRD_PARTY.md.

[graph]
all-features = false

[licenses]
# A crate with an unrecognised or missing licence is an error, not a guess.
confidence-threshold = 0.93
allow = [
    "GPL-3.0-or-later", # EmuDome's own crates
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
