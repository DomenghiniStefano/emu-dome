[package]
name = "emudome-core"
description = "EmuDome's libretro host: core loading, emulation thread, states, speed."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
libretro-sys.workspace = true
anyhow = "1"
libloading = "0.9"
log = "0.4"
parking_lot = "0.12"
png = "0.18"
# The audio queue between the emulation thread and the audio output (`audio.rs`): a lock-free
# single-producer single-consumer ring, so the real-time callback never waits on a lock the
# emulation thread holds. MIT OR Apache-2.0.
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha1 = "0.10"
# TypeScript types of the DTOs (`contract.rs`, app/src/generated/). MIT. Its warning about serde
# attributes it cannot read (`try_from`, `into`) is off: those types carry `#[ts(type = ..)]`.
ts-rs = { version = "12.0", features = ["no-serde-warnings"] }
