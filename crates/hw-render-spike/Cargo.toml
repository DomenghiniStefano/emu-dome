[package]
name = "hw-render-spike"
description = "Feasibility spike (Trello #16): a libretro core rendering through SET_HW_RENDER (Vulkan) on wgpu's device, windowless."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
libretro-sys.workspace = true
anyhow = "1"
# Same versions as wgpu 30 resolves (one wgpu, one ash in the tree).
ash = "0.38"
env_logger = "0.11"
libloading = "0.9"
log = "0.4"
parking_lot = "0.12"
png = "0.18"
pollster = "0.4"
wgpu = "30"
wgpu-hal = { version = "30", features = ["vulkan"] }
