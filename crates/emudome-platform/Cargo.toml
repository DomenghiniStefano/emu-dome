[package]
name = "emudome-platform"
description = "Operating-system-dependent code for EmuDome."
version.workspace = true
edition.workspace = true
license.workspace = true
# `links` turns the Android library in `android/` into a Gradle module of the app:
# build.rs prints `android_library_path`, Cargo hands it to the app's build script as
# `DEP_EMUDOME_PLATFORM_ANDROID_LIBRARY_PATH` and tauri-build includes it in the Gradle project.
links = "emudome-platform"
build = "build.rs"

[lints]
workspace = true

[features]
# The development places for the cores (`EMUDOME_CORES_DIR`, `cores/` above the working
# directory, the system's libretro folders) and no cores.lock check, in a release build too.
# Debug builds always have them; the app's `bench` feature turns this on (bench runs are release
# builds started from the repo). Never on in a package.
dev-core-paths = []

[dependencies]
log = "0.4"
raw-window-handle = "0.6"
# The release build checks its cores against cores.lock (`cores.rs`).
serde_json = "1"
sha2 = "0.10"
# `Webview::with_webview` (the Android JNI handle) and the main window ([`create_window`]:
# `unstable` for the desktop's child webview); features unify with the app's.
# Pinned exactly, the same version as app/src-tauri/Cargo.toml (which says why).
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "unstable"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
# The native file picker (`pick_file`); Android has no file-path picker yet (TODO with the SAF).
tauri-plugin-dialog = "2.8"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
# Same versions as wry/tao: the `JNIEnv` handed by `JniHandle::exec` is jni 0.21's.
jni = "0.21"
ndk = { version = "0.9", default-features = false, features = ["rwh_06"] }
parking_lot = "0.12"
