[package]
name = "emudome-platform"
description = "EmuDome's operating-system and form-factor dependent code: windows, file pickers, logs, core paths, the Android surface."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# `links` turns the Android library in `android/` into a Gradle module of the app:
# build.rs prints `android_library_path`, Cargo hands it to the app's build script as
# `DEP_EMUDOME_PLATFORM_ANDROID_LIBRARY_PATH` and tauri-build includes it in the Gradle project.
links = "emudome-platform"
build = "build.rs"

[lints]
workspace = true

[features]
# The development places for the cores (`EMUDOME_CORES_DIR`, `cores/` above the working
# directory, the system's libretro folders) and no cores.lock check, in a release build too.
# Debug builds always have them; the app's `bench` feature turns this on (bench runs are release
# builds started from the repo). Never on in a package.
dev-core-paths = []

[dependencies]
# `std`: the boxed logger that also writes the log file (`log_file.rs`).
log = { version = "0.4", features = ["std"] }
# The room left on the data folder's disk (`storage.rs`, E13, Trello #29): one call per system
# (GetDiskFreeSpaceExW on Windows, statvfs on Linux and Android). MIT OR Apache-2.0; already
# shipped through librashader's cache (persy), so the same version and no new licence.
fs2 = "0.4"
raw-window-handle = "0.6"
# The release build checks its cores against cores.lock (`cores.rs`).
serde_json = "1"
sha2 = "0.10"
# `Webview::with_webview` (the Android JNI handle) and the main window ([`create_window`]:
# `unstable` for the desktop's child webview); features unify with the app's.
# Pinned exactly, the same version as app/src-tauri/Cargo.toml (which says why).
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "unstable"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
# The native file picker (`pick_file`); Android has no file-path picker yet (TODO with the SAF).
tauri-plugin-dialog = "2.8"
# EmuDome updating itself (`updater.rs`, Trello #44): Tauri's updater, desktop only (Android
# updates come from Google Play). Apache-2.0 OR MIT. Its tauri requirement (2.10) is met by the
# exact pin above; it moves with tauri. TLS through the system (`native-tls`: SChannel on
# Windows, OpenSSL on Linux), not its default rustls: that one brings rustls-platform-verifier
# and webpki-root-certs (CDLA-Permissive-2.0, not on deny.toml's list; the owner decides). No
# `zip`: the update packages are the v2 ones (the installer itself), never Tauri v1's archives.
tauri-plugin-updater = { version = "2.10", default-features = false, features = [
    "native-tls",
    "system-proxy",
] }

# The Drive sign-in's refresh token in the system's credential store (`cloud.rs`), under
# the service `it.domehub.emudome`. MIT OR Apache-2.0. One backend per system, each pure Rust:
# Windows' Credential Manager; on Linux the Secret Service over D-Bus through zbus (no libdbus,
# no OpenSSL: `crypto-rust`), on the tokio runtime Tauri ships. Android keeps no refresh token
# (Google's AuthorizationClient hands out access tokens; Phase 4); macOS is not built yet.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = [
    "async-secret-service",
    "crypto-rust",
    "tokio",
] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
# Same versions as wry/tao: the `JNIEnv` handed by `JniHandle::exec` is jni 0.21's.
jni = "0.21"
ndk = { version = "0.9", default-features = false, features = ["rwh_06"] }
parking_lot = "0.12"
