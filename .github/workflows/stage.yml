# A test build for Google Play's internal testing track (docs/release.md, «Test builds»): every push to
# `stage` builds the signed Android App Bundle and uploads it there (play-release.yml).
# Environment `play-internal`: deployments limited to the `stage` branch; its service account can release to
# the testing tracks only.

name: stage

on:
  push:
    branches: [stage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  play-internal:
    uses: ./.github/workflows/play-release.yml
    # The called job reads its environment's secrets only when the caller hands them over.
    secrets: inherit
    with:
      environment: play-internal
      track: internal
