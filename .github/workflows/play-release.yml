# The Android release for Google Play, shared by stage.yml (test builds, internal track) and main.yml (releases):
# builds the signed App Bundle with scripts/android-build.sh and uploads it to the track asked for.
# The version is Cargo.toml's (scripts/versions.mjs); it must be higher than every upload's before it, or Play
# refuses the upload (raise it with `node scripts/versions.mjs bump` on develop).
#
# Secrets, in the GitHub environment the caller names (never in the repository):
#   EMUDOME_KEYSTORE_BASE64     the upload keystore, base64 (Play App Signing holds the app's own key)
#   EMUDOME_KEYSTORE_PASSWORD, EMUDOME_KEY_ALIAS, EMUDOME_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON   that environment's Google Play service account (play-internal: testing tracks
#                               only; play-production: production too, behind the owner's approval)
# Every action is pinned to a commit (the tag it was in the comment).

name: play-release

on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment holding the secrets (play-internal, play-production).
        required: true
        type: string
      track:
        description: The Google Play track (internal, alpha, production).
        required: true
        type: string
      tag:
        description: Tag the commit v<version> once the upload went through (releases only).
        required: false
        type: boolean
        default: false

jobs:
  play:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 120
    # Permissions come from the caller: main.yml grants contents: write for the v<version> tag.
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          version=$(node scripts/versions.mjs print)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "EmuDome $version to Google Play's ${{ inputs.track }} track" >> "$GITHUB_STEP_SUMMARY"

      - name: A release is a new version
        if: inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released: raise the version (node scripts/versions.mjs bump) first."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # compileSdk 37 is the package android-37.0 (platforms carry a minor number since Android 16).
      - name: Android platform and NDK
        run: sdkmanager "platforms;android-37.0" "ndk;$NDK_VERSION"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Upload keystore (outside the repository)
        env:
          KEYSTORE_BASE64: ${{ secrets.EMUDOME_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo 'EMUDOME_KEYSTORE_BASE64 is not set'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Signed App Bundle
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          EMUDOME_KEYSTORE: ${{ runner.temp }}/upload.jks
          EMUDOME_KEYSTORE_PASSWORD: ${{ secrets.EMUDOME_KEYSTORE_PASSWORD }}
          EMUDOME_KEY_ALIAS: ${{ secrets.EMUDOME_KEY_ALIAS }}
          EMUDOME_KEY_PASSWORD: ${{ secrets.EMUDOME_KEY_PASSWORD }}
        run: sh scripts/android-build.sh --bundle

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emudome-${{ steps.version.outputs.version }}-aab
          path: app/src-tauri/gen/android/app/build/outputs/bundle/arm64Release/app-arm64-release.aab
          retention-days: 14

      - name: Google Play service account
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$PLAY_JSON" ] || { echo 'PLAY_SERVICE_ACCOUNT_JSON is not set in this environment'; exit 1; }

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: it.domehub.emudome
          releaseFiles: app/src-tauri/gen/android/app/build/outputs/bundle/arm64Release/app-arm64-release.aab
          releaseName: ${{ steps.version.outputs.version }}
          track: ${{ inputs.track }}
          status: completed

      - name: Tag the release
        if: inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh api "repos/${{ github.repository }}/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA"

      - name: Forget the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
